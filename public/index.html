<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf0f0">
  <title>Think Twice</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <a class="wordmark" href="#karen"><span data-icon="shield"></span>Think Twice</a>
    <nav class="roles" aria-label="Switch phone">
      <a id="role-karen" href="#karen" aria-current="page">Karen</a>
      <a id="role-emily" href="#emily">Emily<span class="role-dot" hidden></span></a>
    </nav>
    <button class="reset" type="button" data-action="reset" aria-label="Reset demo" title="Reset demo"><span data-icon="reset"></span></button>
  </header>

  <div class="device">
    <div class="status-bar" aria-hidden="true">
      <span>4:56</span>
      <div class="status-icons"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></div>
    </div>
    <main id="screen"></main>
    <div class="device-bottom"><a href="#karen" id="home-indicator" aria-label="Phone home"><span></span></a></div>
  </div>

  <dialog id="payment-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message"></dialog>
  <div id="announcement" class="sr-only" role="status"></div>
</body>
</html>
